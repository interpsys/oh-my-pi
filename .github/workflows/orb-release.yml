name: Orb Release

on:
   push:
      tags:
         - "v*-orb.*"
   workflow_dispatch:
      inputs:
         tag:
            description: "Fork release tag (for example v18.20.0-orb.1)"
            required: false
            type: string

permissions:
   contents: read

concurrency:
   group: "${{ github.workflow }}-${{ github.ref }}"
   cancel-in-progress: false

env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
   resolve:
      name: Resolve fork release tag
      if: github.repository != 'can1357/oh-my-pi'
      runs-on: ubuntu-22.04
      outputs:
         tag: ${{ steps.detect.outputs.tag }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              fetch-tags: true
         - name: Resolve and validate tag
           id: detect
           shell: bash
           env:
              INPUT_TAG: ${{ inputs.tag }}
              REF: ${{ github.ref }}
              REF_NAME: ${{ github.ref_name }}
           run: |
              set -euo pipefail
              tag="$INPUT_TAG"
              if [ -z "$tag" ] && [[ "$REF" == refs/tags/* ]]; then
                tag="$REF_NAME"
              fi
              if [ -z "$tag" ]; then
                tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-orb\.[0-9]+$' | head -n1 || true)
              fi
              if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-orb\.[0-9]+$ ]]; then
                echo "Expected a vX.Y.Z-orb.N tag, got: '$tag'" >&2
                exit 1
              fi
              echo "Building fork release assets for $tag"
              echo "tag=$tag" >> "$GITHUB_OUTPUT"

   build_binary:
      name: "Build fork binary (${{ matrix.target_id }})"
      needs: [resolve]
      if: needs.resolve.outputs.tag != ''
      runs-on: ${{ matrix.os }}
      timeout-minutes: 45
      strategy:
         fail-fast: false
         matrix:
            include:
               - {
                    os: macos-15,
                    target_id: darwin-arm64,
                    binary_path: packages/coding-agent/binaries/omp-darwin-arm64,
                 }
               - {
                    os: ubuntu-22.04,
                    target_id: linux-x64,
                    binary_path: packages/coding-agent/binaries/omp-linux-x64,
                 }
               - {
                    os: ubuntu-24.04-arm,
                    target_id: linux-arm64,
                    binary_path: packages/coding-agent/binaries/omp-linux-arm64,
                 }
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ needs.resolve.outputs.tag }}
         - uses: ./.github/actions/bun-install
         - name: Ensure Rust toolchain
           shell: bash
           run: |
              set -euo pipefail
              if ! command -v rustup >/dev/null 2>&1; then
                curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
                echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
                export PATH="$HOME/.cargo/bin:$PATH"
              fi
              rustup show
         - name: Build host native addon
           env:
              OMP_NATIVE_CARGO_PROFILE: ci
           run: bun --cwd=packages/natives run build
         - name: Build release binary
           env:
              RELEASE_TARGETS: ${{ matrix.target_id }}
           run: bun run ci:release:build-binaries
         - name: Smoke test binary
           shell: bash
           env:
              BINARY: ${{ matrix.binary_path }}
           run: |
              set -euo pipefail
              chmod +x "$BINARY"
              if [ "$RUNNER_OS" = macOS ]; then
                codesign --verify --strict --verbose=2 "$BINARY"
              fi
              runtime_dir="$(mktemp -d)"
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$BINARY" --version
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "$BINARY" --smoke-test
         - name: Upload binary artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: fork-binary-${{ matrix.target_id }}
              path: ${{ matrix.binary_path }}
              if-no-files-found: error
              retention-days: 1
         - name: Pack coding-agent npm tarball
           if: matrix.target_id == 'linux-x64'
           shell: bash
           run: |
              set -euo pipefail
              mkdir -p release-tarball
              cp packages/coding-agent/package.json "$RUNNER_TEMP/coding-agent-package.json.orig"
              rc=0
              {
                bun -e 'import { applyPublishBin } from "./scripts/ci-release-publish.ts"; await applyPublishBin("packages/coding-agent", true);' &&
                  (cd packages/coding-agent && bun pm pack --destination ../../release-tarball --quiet)
              } || rc=$?
              cp "$RUNNER_TEMP/coding-agent-package.json.orig" packages/coding-agent/package.json
              [ "$rc" -eq 0 ] || exit "$rc"
              ls -la release-tarball/
         - name: Upload npm tarball artifact
           if: matrix.target_id == 'linux-x64'
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: fork-tarball
              path: release-tarball/oh-my-pi-pi-coding-agent-*.tgz
              if-no-files-found: error
              retention-days: 1

   publish_release:
      name: Publish fork GitHub Release
      needs: [resolve, build_binary]
      runs-on: ubuntu-22.04
      permissions:
         contents: write
      steps:
         - name: Download binaries
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: fork-binary-*
              path: release-assets
              merge-multiple: true
         - name: Download npm tarball
           uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              name: fork-tarball
              path: release-assets
         - name: Generate checksums
           shell: bash
           run: |
              set -euo pipefail
              (
                cd release-assets
                LC_ALL=C sha256sum omp-* oh-my-pi-pi-coding-agent-*.tgz > SHA256SUMS.txt
              )
              ls -la release-assets/
         - name: Create GitHub Release
           uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
           with:
              tag_name: ${{ needs.resolve.outputs.tag }}
              prerelease: false
              files: release-assets/*
              generate_release_notes: true
